name: Native iOS parity
on:
  push:
    branches: [ios-native]
    paths: ['ios/**', '.github/workflows/ios.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build-test-artifacts:
    runs-on: macos-26
    timeout-minutes: 35
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
      HOMEBREW_NO_AUTO_UPDATE: '1'
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Inspect pinned toolchain and choose available iPhone
        run: bash ios/scripts/ci.sh inventory
      - name: Cache Swift packages
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ios/.spm
          key: spm-macos26-xcode26.6-${{ hashFiles('ios/**/Package.resolved', 'ios/**/Package.swift', 'ios/project.yml') }}
      - name: Generate Xcode project
        run: |
          xcodegen_archive="$RUNNER_TEMP/xcodegen-2.46.0.zip"
          curl --fail --location --retry 3 --silent --show-error https://github.com/yonaskolb/XcodeGen/releases/download/2.46.0/xcodegen.zip --output "$xcodegen_archive"
          printf '%s  %s\n' 4d9e34b62172d645eed6457cac13fc222569974098ef4ee9c3368bedf0196806 "$xcodegen_archive" | shasum -a 256 --check -
          unzip -q "$xcodegen_archive" -d "$RUNNER_TEMP/twildiary-tools"
          "$RUNNER_TEMP/twildiary-tools/xcodegen/bin/xcodegen" generate --spec ios/project.yml
      - name: Compile simulator and test bundles
        id: simulator
        run: bash ios/scripts/ci.sh build-simulator
      - name: Test core calculations and catalog contracts
        run: swift test --package-path ios/Packages/TwilDiaryCore 2>&1 | tee ios/.artifacts/logs/core-tests.log
      - name: Compile unsigned physical iPhone application
        id: device
        run: bash ios/scripts/ci.sh build-device
      - name: Package unsigned IPA
        if: ${{ !cancelled() && steps.device.outcome == 'success' }}
        run: bash ios/scripts/ci.sh package
      - name: Upload unsigned IPA
        if: ${{ !cancelled() && steps.device.outcome == 'success' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: TwilDiary-unsigned-IPA
          path: |
            ios/.artifacts/TwilDiary-unsigned.ipa
            ios/.artifacts/TwilDiary-unsigned.ipa.sha256
          if-no-files-found: error
          retention-days: 14
      - name: Run unit and UI tests
        timeout-minutes: 15
        run: bash ios/scripts/ci.sh test
      - name: Export screenshots
        if: always()
        run: bash ios/scripts/ci.sh screenshots
      - name: Upload xcresult and full logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: TwilDiary-test-results-and-logs
          include-hidden-files: true
          path: |
            ios/.artifacts/*.xcresult
            ios/.artifacts/logs
            ios/.artifacts/toolchain.txt
            ios/.artifacts/devices.json
            ios/.artifacts/simulator.json
          if-no-files-found: error
          retention-days: 14
      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: TwilDiary-screenshots
          path: ios/.artifacts/screenshots
          if-no-files-found: warn
          retention-days: 14
      - name: Print diagnostics and enforce zero build warnings
        if: always()
        run: bash ios/scripts/ci.sh summary
